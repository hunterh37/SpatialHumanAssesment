<style>
  /* Dusk theme v1.0. Spec: concept/SpatialAge_Dusk_Design_Spec.pdf, sections 2 and 10. */
  :root{--bg:#1B191A;--surface:#262324;--surface-2:#2F2B2C;--fg:#F7E9DA;--mute:#A89698;
    --line:rgba(251,218,180,.13);--accent:#FBDAB4;--accent-strong:#D8AB8B;--on-accent:#252322;
    --accent-soft:rgba(216,171,139,.2);--warn:#FF9A62;--go:#2F6BFF;--nogo:#FF7A3D;--gold:#FFC83D;--follow:#14B8A6;
    color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.45 Figtree,system-ui,sans-serif;padding:32px;
    font-variant-numeric:tabular-nums}
  .label{font:600 12px Figtree,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  header{display:flex;align-items:center;gap:20px;margin-bottom:24px}
  header h1{font:300 28px Urbanist,sans-serif;margin:0;flex:1}
  .live{display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--nogo);animation:pulse 1.6s ease-in-out infinite}
  .live.off .dot{background:var(--mute);animation:none}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  button{font:600 15px Figtree,sans-serif;border-radius:999px;min-height:44px;padding:0 22px;cursor:pointer;
    background:rgba(251,218,180,.09);color:var(--fg);border:1px solid rgba(251,218,180,.22)}
  button:hover{background:rgba(251,218,180,.2)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .board{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}
  .hero{font:200 112px/1 Urbanist,sans-serif;letter-spacing:-.04em;margin:8px 0}
  .hero small{font:300 28px Urbanist,sans-serif;letter-spacing:0;color:var(--mute);margin-left:6px}
  .row{display:flex;gap:24px;align-items:baseline;color:var(--mute)}
  .row b{color:var(--fg);font-weight:400}
  .rounds{display:flex;gap:8px;margin-top:14px}
  .rounds i{width:10px;height:10px;border-radius:50%;background:rgba(251,218,180,.2)}
  .rounds i.won{background:rgba(251,234,218,.75)}
  svg{display:block;width:100%;height:120px;margin:12px 0}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
  td{padding:10px 12px;border-bottom:1px solid var(--line)}
  tr.current td{background:var(--accent-soft)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .tile .v{font:200 48px/1.1 Urbanist,sans-serif;letter-spacing:-.04em;margin-top:6px}
  .stack{display:grid;gap:16px;margin-top:16px}
  .sample{color:var(--mute);font-size:13px}
  .empty{color:var(--mute);padding:12px 0}
  @media (max-width:820px){.grid,.tiles{grid-template-columns:1fr}body{padding:16px}.hero{font-size:80px}}
  /* Brand mark: the BetterYears Age bird (docs/brand). Never recolor it. */
  .brand-mark { height: 40px; width: auto; flex: none; }
</style>

  <div class="live off" id="live"><span class="dot"></span><span class="label">Live</span></div>
  <h1 id="game">Waiting for headset</h1>
  <span class="label" id="round"></span>
  <button id="pause">Pause</button>
</header>

<div class="grid" id="players"></div>

<div class="stack">
  <div class="board">
    <div class="label">Leaderboard · best catch</div>
    <table>
      <thead><tr><th class="label">Rank</th><th class="label">Code</th><th class="label">Best ms</th><th class="label">Movement age</th><th class="label">Gap</th></tr></thead>
      <tbody id="board"><tr><td colspan="5" class="empty">No sessions yet.</td></tr></tbody>
    </table>
  </div>
  <div class="tiles">
    <div class="board tile"><div class="label">Sessions</div><div class="v" id="t-sessions">0</div></div>
    <div class="board tile"><div class="label">Age range</div><div class="v" id="t-ages">–</div></div>
    <div class="board tile"><div class="label">Valid-trial rate</div><div class="v" id="t-valid">–</div></div>
  </div>
</div>

<script>
// Spec: specs/dashboard.md and Dusk spec section 10. Live events from WS /live, sessions from GET /sessions.
const LO = 250, HI = 750, KEEP = 16;
const players = new Map();   // code -> {rts:[], caught, wins}
let current = null, paused = false, trials = 0, valid = 0;

const TASKS = {pendulum:"Pendulum", simple_rt:"Spark", choice_rt:"Gate", corsi:"Constellation", pursuit:"Orbit",
  reach_grab:"Reach and Grab", wall:"Hole in the Wall", color_dots:"Color Dots"};

function player(code) {
  if (!players.has(code)) players.set(code, {rts: [], caught: 0, wins: 0});
  return players.get(code);
}

function median(a) {
  if (!a.length) return null;
  const s = [...a].sort((x, y) => x - y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

function sparkline(rts) {
  const w = 400, h = 120, y = v => h - (Math.min(Math.max(v, LO), HI) - LO) / (HI - LO) * h;
  const grid = [300, 500, 700].map(v =>
    `<line x1="0" x2="${w}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(251,218,180,.13)"/>` +
    `<text x="${w}" y="${y(v) - 4}" text-anchor="end" fill="#A89698" font-size="11" font-family="JetBrains Mono">${v}</text>`).join("");
  if (!rts.length) return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}</svg>`;
  const step = w / (KEEP - 1), pts = rts.map((v, i) => [i * step, y(v)]);
  const [ex, ey] = pts[pts.length - 1];
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${grid}
    <polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="#D8AB8B" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="${ex}" cy="${ey}" r="5" fill="#FBDAB4"/></svg>`;
}

function renderPlayers() {
  const el = document.getElementById("players");
  const list = [...players.entries()].slice(-2);
  if (!list.length) { el.innerHTML = `<div class="board empty">Waiting for the first trial.</div>`; return; }
  el.innerHTML = list.map(([code, p]) => {
    const last = p.rts.length ? Math.round(p.rts[p.rts.length - 1]) : null;
    const med = median(p.rts);
    return `<div class="board">
      <div class="label mono">${code}</div>
      <div class="label" style="margin-top:12px">Last catch</div>
      <div class="hero">${last ?? "–"}<small>ms</small></div>
      ${sparkline(p.rts)}
      <div class="row"><span>Median <b>${med ? Math.round(med) : "–"} ms</b></span><span>Caught <b>${p.caught}</b></span></div>
      <div class="rounds">${[0, 1, 2, 3].map(i => `<i class="${i < p.wins ? "won" : ""}"></i>`).join("")}</div>
    </div>`;
  }).join("");
}

async function renderBoard() {
  let rows = [];
  try { rows = await (await fetch("/sessions")).json(); } catch { return; }
  const best = new Map();
  for (const r of rows) {
    const f = r.features || {}, rt = f.simple_rt_median ?? f.choice_rt_median;
    const code = r.participant?.code ?? "–";
    if (rt == null) continue;
    const prev = best.get(code);
    if (!prev || rt < prev.rt) best.set(code, {code, rt, age: r.functional_age, real: r.participant?.age_years});
  }
  const sorted = [...best.values()].sort((a, b) => a.rt - b.rt).slice(0, 10);
  document.getElementById("board").innerHTML = sorted.length ? sorted.map((r, i) => {
    const gap = r.age != null && r.real != null ? (r.age - r.real) : null;
    return `<tr class="${players.has(r.code) ? "current" : ""}"><td>${i + 1}</td><td class="mono">${r.code}</td>
      <td>${Math.round(r.rt * 1000)}</td><td>${r.age != null ? r.age.toFixed(1) : "–"}</td>
      <td>${gap != null ? (gap > 0 ? "+" : "") + gap.toFixed(1) : "–"}</td></tr>`;
  }).join("") : `<tr><td colspan="5" class="empty">No sessions yet.</td></tr>`;
  const ages = rows.map(r => r.participant?.age_years).filter(a => a != null);
  document.getElementById("t-sessions").textContent = rows.length;
  document.getElementById("t-ages").textContent = ages.length ? `${Math.min(...ages)}–${Math.max(...ages)}` : "–";
}

function connect() {
  const live = document.getElementById("live");
  const ws = new WebSocket(`ws://${location.host}/live`);
  ws.onopen = () => live.classList.remove("off");
  ws.onclose = () => { live.classList.add("off"); setTimeout(connect, 1500); };
  ws.onmessage = e => {
    if (paused) return;
    const m = JSON.parse(e.data);
    if (m.type === "trial_end") {
      const code = m.participant ?? m.code ?? current ?? "Player";
      current = code;
      document.getElementById("game").textContent = `${TASKS[m.task] ?? m.task} · trial ${m.index + 1}`;
      if (m.round) document.getElementById("round").textContent = `Round ${m.round} of 4`;
      trials++;
      if (m.outcome !== "invalid") valid++;
      document.getElementById("t-valid").textContent = `${Math.round(valid / trials * 100)}%`;
      const p = player(code);
      if (m.rt != null) {
        p.rts.push(m.rt * 1000);
        if (p.rts.length > KEEP) p.rts.shift();
      }
      if (m.outcome === "hit" || m.outcome === "caught") p.caught++;
      renderPlayers();
    }
    if (m.type === "result") {
      current = m.participant?.code ?? current;
      renderBoard();
    }
  };
}

document.getElementById("pause").onclick = e => {
  paused = !paused;
  e.target.textContent = paused ? "Resume" : "Pause";
};

renderPlayers();
renderBoard();
connect();
</script>
