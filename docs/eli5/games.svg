<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="eli5-games-title eli5-games-desc" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="eli5-games-title">Four quick games</title>
  <desc id="eli5-games-desc">Four game tiles: Catch for reaction, Color dots for memory, Reach and grab for reach, and Hole in the wall for balance.</desc>
  <rect width="1200" height="540" fill="#f6f4ef"/>
  <text x="48" y="64" font-size="14" fill="#8a8f99" font-weight="700" letter-spacing="3">ELI5 · STEP 2</text>
  <text x="48" y="100" font-size="32" fill="#1b2430" font-weight="700">Four quick games</text>
  <text x="48" y="132" font-size="16" fill="#8a8f99">Each game checks one thing your body or brain does every day.</text>
  <rect x="48" y="168" width="258" height="296" rx="12" fill="#ffffff" stroke="#d9d4c7" stroke-width="1.5"/>
  <svg x="121.0" y="196" width="112" height="112" viewBox="0 0 64 64"><g fill="none" stroke="#1b2430" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 6 L37 26 L32 30 L27 26 Z"/><path d="M32 30 V40"/><path d="M18 8 V18 M46 8 V18"/></g><path d="M16 50 Q32 62 48 50" fill="none" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/></svg>
  <text x="177.0" y="352" font-size="22" font-weight="700" fill="#1b2430" text-anchor="middle">Catch</text>
  <text x="177.0" y="384" font-size="13" font-weight="700" fill="#2f6bff" letter-spacing="2" text-anchor="middle">REACTION</text>
  <text x="177.0" y="420" font-size="16" fill="#5f6672" text-anchor="middle">Grab the falling knives</text>
  <rect x="330" y="168" width="258" height="296" rx="12" fill="#ffffff" stroke="#d9d4c7" stroke-width="1.5"/>
  <svg x="403.0" y="196" width="112" height="112" viewBox="0 0 64 64"><circle cx="14" cy="18" r="8" fill="#2f6bff"/><circle cx="48" cy="14" r="8" fill="#ff7a3d"/><circle cx="34" cy="38" r="8" fill="#2f6bff"/><circle cx="12" cy="50" r="7" fill="none" stroke="#1b2430" stroke-width="3"/><g fill="none" stroke="#1b2430" stroke-width="3" stroke-linecap="round"><path d="M46 56 L38 46"/><path d="M48 40 V44 M56 46 H52 M54 52 L51 50"/></g></svg>
  <text x="459.0" y="352" font-size="22" font-weight="700" fill="#1b2430" text-anchor="middle">Color dots</text>
  <text x="459.0" y="384" font-size="13" font-weight="700" fill="#2f6bff" letter-spacing="2" text-anchor="middle">MEMORY</text>
  <text x="459.0" y="420" font-size="16" fill="#5f6672" text-anchor="middle">Tap only the dots you saw</text>
  <rect x="612" y="168" width="258" height="296" rx="12" fill="#ffffff" stroke="#d9d4c7" stroke-width="1.5"/>
  <svg x="685.0" y="196" width="112" height="112" viewBox="0 0 64 64"><g fill="none" stroke="#1b2430" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="14" r="6"/><path d="M19 20 L24 40"/><path d="M24 40 L18 58 M24 40 L30 58"/></g><path d="M21 26 L46 22" fill="none" stroke="#2f6bff" stroke-width="3" stroke-linecap="round"/><rect x="48" y="14" width="12" height="12" rx="2" fill="#2f6bff"/></svg>
  <text x="741.0" y="352" font-size="22" font-weight="700" fill="#1b2430" text-anchor="middle">Reach and grab</text>
  <text x="741.0" y="384" font-size="13" font-weight="700" fill="#2f6bff" letter-spacing="2" text-anchor="middle">REACH</text>
  <text x="741.0" y="420" font-size="16" fill="#5f6672" text-anchor="middle">Tap to grab, reach farther</text>
  <rect x="894" y="168" width="258" height="296" rx="12" fill="#ffffff" stroke="#d9d4c7" stroke-width="1.5"/>
  <svg x="967.0" y="196" width="112" height="112" viewBox="0 0 64 64"><rect x="10" y="4" width="44" height="56" rx="2" fill="none" stroke="#1b2430" stroke-width="3"/><g fill="none" stroke="#2f6bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="16" r="5"/><path d="M32 21 V40"/><path d="M18 26 L32 30 L46 22"/><path d="M32 40 L26 54 M32 40 L38 54"/></g><g fill="none" stroke="#1b2430" stroke-width="2" stroke-linecap="round"><path d="M2 20 H6 M2 32 H6 M2 44 H6"/></g></svg>
  <text x="1023.0" y="352" font-size="22" font-weight="700" fill="#1b2430" text-anchor="middle">Hole in the wall</text>
  <text x="1023.0" y="384" font-size="13" font-weight="700" fill="#2f6bff" letter-spacing="2" text-anchor="middle">BALANCE</text>
  <text x="1023.0" y="420" font-size="16" fill="#5f6672" text-anchor="middle">Hold the pose, beat the wall</text>
  <text x="48" y="504" font-size="16" fill="#8a8f99">Both balance games keep your feet on the floor, so you find your limits before you ever fall.</text>
</svg>
